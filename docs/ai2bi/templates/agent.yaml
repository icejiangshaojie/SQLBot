agent_code: corp_deposit_agent
name: 对公存款分析 Agent
version: 0.1.0
status: draft
domain_ref: corp_deposit
workspace_ref: workspace.default
business_line: 对公
owner: business.owner@example.com

capabilities:
  - knowledge_qa
  - data_query
  - data_analysis
entry_signals:
  - 对公存款
  - 公司存款
  - 企业存款
  - 存款余额
negative_signals:
  - 零售存款
  - 理财

skill_refs:
