  - trend
  - ranking
  - structure_split
  - anomaly
limits:
  max_queries: 3
  max_rows_per_query: 1000
  timeout_seconds: 60
qa_config:
  block_unsourced_numbers: true
  block_prediction: true
  block_unsupported_causality: true
  require_mandatory_filters: true

test_refs:
  - test.corp_deposit.routing
  - test.corp_deposit.sql
  - test.corp_deposit.evidence
change_reason: 初始 Agent 草稿
