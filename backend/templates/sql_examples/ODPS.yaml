template:
  quot_rule: |
    <rule>
      MaxCompute (ODPS) SQL 中不需要对表名、字段名加引号。
      <note>
        1. 直接使用原始表名和字段名，如 SELECT trans_amt_hkd FROM dwd_fct_card_auth_d
        2. 不要使用反引号（`）或双引号（"）包裹标识符
        3. 在多表关联（JOIN）/ 多子查询的 SQL 中，只要多个表 / 子查询存在 同名字段，所有引用该字段的位置，必须显式指定 表别名.字段名
        4. 别名使用 AS 关键字，不加引号
      </note>
    </rule>

  limit_rule: |
    <rule>
      必须使用 LIMIT 限制行数，默认 LIMIT 1000。
      ODPS 查询费用按数据扫描量计算，LIMIT 可以降低成本和执行时间。
    </rule>

  other_rule: |
    <rule>必须为每个表生成别名（不加AS）</rule>
    {multi_table_condition}
    <rule>禁止使用星号(*)，必须明确字段名（DESC命令除外）</rule>
    <rule>中文/特殊字符字段需保留原名并添加英文别名</rule>
    <rule>不能用 + 拼接字符串，字符串必须使用单引号</rule>
    <rule>分组非常严格：SELECT 里的字段必须出现在 GROUP BY 里，或者是聚合函数</rule>
    <rule>函数字段必须加别名</rule>
    <rule>百分比字段保留两位小数并以%结尾</rule>
    <rule>【分区规则】全量快照表必须加分区条件 pt = (SELECT MAX(pt) FROM 表名)，增量表必须加 pt BETWEEN '起始日期' AND '结束日期'</rule>
    <rule>【业务日期】使用 trans_date / business_date 字段，不要用 pt 做业务日期</rule>
    <rule>【金额单位】trans_amt_hkd 等金额字段单位为元，不是万</rule>
    <rule>判空使用 COALESCE() 或 NVL()函数</rule>
    <rule>避免与ODPS关键字冲突</rule>
    <rule>日期格式：pt 为 yyyymmdd 字符串，trans_date 为 yyyy-mm-dd</rule>

  basic_example: |
    <basic-examples>
      <intro>
        📌 以下示例严格遵循 ODPS（MaxCompute）SQL 规范。
        ⚠️ 注意：示例中的表名、字段名均为演示虚构，实际使用时需替换为真实标识符。
        🔍 重点观察：
          1. 不使用任何引号包裹标识符
          2. 分区条件 pt 的正确写法
          3. LIMIT 的使用
      </intro>
      <example>
        <input>查询卡消费表 dwd_fct_retail_cust_card_auth_d_delta 最近一天的消费总额</input>
        <output-good>
          SELECT
            SUM(t1.trans_amt_hkd) AS total_amount,
            COUNT(*) AS total_count
          FROM dwd_fct_retail_cust_card_auth_d_delta t1
          WHERE t1.pt = (SELECT MAX(pt) FROM dwd_fct_retail_cust_card_auth_d_delta)
            AND t1.is_successful_auth = 1
          LIMIT 1000
        </output-good>
      </example>
      <example>
        <input>按 HK/MCV 拆分客户类型统计数量</input>
        <output-good>
          SELECT
            c.cust_sub_type AS customer_type,
            COUNT(DISTINCT t1.cust_no) AS customer_count
          FROM dwd_fct_retail_cust_card_auth_d_delta t1
          JOIN dim_cust_basic_info_ext_d c
            ON t1.cust_no = c.cust_no
          WHERE t1.pt BETWEEN '20260701' AND '20260731'
            AND t1.is_successful_auth = 1
          GROUP BY c.cust_sub_type
          ORDER BY customer_count DESC
          LIMIT 1000
        </output-good>
      </example>
    </basic-examples>

  example_engine: Alibaba MaxCompute (ODPS)
  example_answer_1: |
    {"success":true,"sql":"SELECT country AS country_name, continent AS continent_name, year AS year, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) ORDER BY country, year","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_1_with_limit: |
    {"success":true,"sql":"SELECT country AS country_name, continent AS continent_name, year AS year, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) ORDER BY country, year LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_2: |
    {"success":true,"sql":"SELECT country AS country_name, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) AND year = '2024' ORDER BY gdp DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_2_with_limit: |
    {"success":true,"sql":"SELECT country AS country_name, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) AND year = '2024' ORDER BY gdp DESC LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_3: |
    {"success":true,"sql":"SELECT country AS country_name, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) AND year = '2025' AND country = '中国'","tables":["sample_country_gdp"],"chart-type":"table"}
  example_answer_3_with_limit: |
    {"success":true,"sql":"SELECT country AS country_name, gdp AS gdp FROM sample_country_gdp t1 WHERE t1.pt = (SELECT MAX(pt) FROM sample_country_gdp) AND year = '2025' AND country = '中国' LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"table"}

  process_check: |
    <check>
      1. 检查SQL是否包含分区条件 pt，如果没有则补充
      2. 检查是否有 LIMIT，如果没有则补充 LIMIT 1000
      3. 检查是否使用了 SELECT *，如果是则替换为明确字段
      4. 检查金额字段是否正确标注单位
      5. 检查日期字段是否使用 trans_date 而非 pt
    </check>
